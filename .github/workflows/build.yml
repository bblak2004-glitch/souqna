
name: Build Souqna Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Souqna
        run: |
          unzip -q souqna_flutter_mvp.zip -d source
          flutter create --platforms=android --project-name souqna app
          cp -R source/souqna_flutter/lib app/
          cp source/souqna_flutter/pubspec.yaml app/

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souqna-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
